<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Vikunja</title>
	<meta name="description" content="Vikunja (/vɪˈkuːnjə/) - The to-do app to organize your life.">
	<meta name="theme-color" content="#1973ff"/>

	<script>
		// Resolve relative build assets before the browser loads them on a credential URL.
		(() => {
			const credential = window.location.pathname.match(/^\/al_[A-Za-z0-9_-]{43}(?=\/|$)/)
			const configured = '%BASE_URL%'
			const base = document.createElement('base')
			base.href = credential ? credential[0] + '/' : configured === './' ? '/' : configured
			document.head.appendChild(base)
		})()
	</script>
	<link rel="icon" href="/favicon.ico">
	<link rel="apple-touch-icon" href="/images/icons/apple-touch-icon-180x180.png"/>
	<!--__vite-plugin-inject-preload__-->
</head>
<body>
<noscript>
	<strong>We're sorry but Vikunja doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>
<script type="module" src="/src/entry.ts"></script>
<script>
	//
	// This variable points the frontend to the api.
	// It has to be the full url, including the last /api/v1 part and port.
	// You can change this if your api is not reachable on the same port as the frontend.
	const credential = window.location.pathname.match(/^\/al_[A-Za-z0-9_-]{43}(?=\/|$)/)
	window.API_URL = credential ? new URL('api/v1', document.baseURI).href : '/api/v1'
</script>
</body>
</html>
